{% set version = "2.5.0" %}
{% set name = "w3lib" %}
{% set deselect_tests = "" %}
{% set deselect_tests = 'deselect_tests + " --deselect=tests/test_url.py::UrlTests::test_file_uri_to_path"' %}  # [win]

# E   AssertionError: 'C:\\windows\\clock.avi' != 'C:\\\\windows\\clock.avi'
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a7ddf714508ddc1b8563bd19ace2feb28080bbaca39326cbc964359f6754f615

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling >=1.27.0
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - w3lib
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests {{ deselect_tests }}

about:
  home: https://github.com/scrapy/w3lib
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  summary: Library of web-related functions
  description: |
    Python library of web-related functions such as extract base url from HTML snippets,
    translate entites on HTML strings, convert raw HTTP headers to dicts and vice-versa,
    construct HTTP auth header, converting HTML pages to unicode, etc.
  doc_url: https://w3lib.readthedocs.io
  dev_url: https://github.com/scrapy/w3lib

extra:
  recipe-maintainers:
    - nehaljwani
