{% set version = "2.6.0" %}
{% set name = "w3lib" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 821f78cfdeb9e675c736ffe0b874bd1e50e9e02997e675ce046b373c009f27be

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<311]

requirements:
  host:
    - python
    - pip
    - hatchling >=1.27.0
  run:
    - python
    - frostwork >=0.2.2

{% set deselect_tests = "" %}
# E   AssertionError: 'C:\\windows\\clock.avi' != 'C:\\\\windows\\clock.avi'
{% set deselect_tests = deselect_tests + " --deselect=tests/test_url.py::UrlTests::test_file_uri_to_path" %}  # [win]

test:
  source_files:
    - tests
    - w3lib
  imports:
    - w3lib
  requires:
    - pip
    - pytest
    - hypothesis >=6.148.0
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv --doctest-modules tests w3lib {{ deselect_tests }}

about:
  home: https://github.com/scrapy/w3lib
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  summary: Library of web-related functions
  description: |
    Python library of web-related functions such as extract base url from HTML snippets,
    translate entites on HTML strings, convert raw HTTP headers to dicts and vice-versa,
    construct HTTP auth header, converting HTML pages to unicode, etc.
  doc_url: https://w3lib.readthedocs.io
  dev_url: https://github.com/scrapy/w3lib

extra:
  recipe-maintainers:
    - nehaljwani
